[package]
name = "blades"
version = "0.1.0"
edition = "2021"

[lib]
name = "blades_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }  # command payloads/results
serde_json = "1"  # opaque documents, $.id check, rules merge
thiserror = "2"  # one error type with messages
chrono = { version = "0.4", default-features = false, features = ["clock"] }  # local time for backup file names

[dev-dependencies]
tempfile = "3"  # temp-dir databases in tests
